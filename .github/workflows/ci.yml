name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

# El token de Actions de este repositorio es de solo lectura por defecto. Cada job pide lo que
# necesita, en vez de heredar un permiso de escritura que casi ninguno usa.
permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-build-gradle.yml@main
    secrets: inherit

  sonar:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-sonarcloud-gradle.yml@main
    with:
      sonar-org: ahincho
      sonar-project-key: ahincho_nova-secrets
    secrets: inherit

  matrix:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-build-matrix.yml@main
    with:
      build-tool: gradle
    secrets: inherit

  owasp:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-owasp-check.yml@main
    with:
      build-tool: gradle
    secrets: inherit

  sbom:
    if: github.event_name == 'pull_request'
    # reusable-sbom.yml declara contents: write para adjuntar el SBOM a un release; sin este
    # permiso el workflow entero no llega a arrancar.
    permissions:
      contents: write
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-sbom.yml@main
    with:
      build-tool: gradle
    secrets: inherit
